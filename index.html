<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Acorn Script Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header, scene index on the left (desktop) and a script sheet that reads like a page */
:root{--bg:#e9e7e3;--sheet:#fff;--ink:#1d1b18;--mut:#6f6a62;--line:#00000017;--acc:#7a5a2e;--chip:#0000000b;
 --scene:#1b5e20;--sceneBg:#e7f4e8;--dlg:#1565c0;--dlgTx:#0b2e5c;--mono:#7b1fa2;--monoTx:#3e1158;--monoBg:#f5eaf9;--th:#d35400;--thTx:#5e2a00;--thBg:#fff1e3;--dual:#00838f;--dualTx:#00464d;--tr:#b71c1c;--note:#8a6d00;--noteBg:#fff6cc;
 --ui:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono-f:"Courier Prime","Courier New",Courier,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121211;--sheet:#1c1b19;--ink:#e8e4dc;--mut:#9d978c;--line:#ffffff1a;--acc:#c79b5b;--chip:#ffffff12;
 --scene:#86c98b;--sceneBg:#1d2e1f;--dlg:#6fb1f5;--dlgTx:#cfe2fb;--mono:#cf93e6;--monoTx:#ecd7f5;--monoBg:#2a1f30;--th:#f0a35c;--thTx:#f8dcc0;--thBg:#33261a;--dual:#4dd0e1;--dualTx:#c6eef3;--tr:#ef9a9a;--note:#e6c75a;--noteBg:#332d14;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121211;--sheet:#1c1b19;--ink:#e8e4dc;--mut:#9d978c;--line:#ffffff1a;--acc:#c79b5b;--chip:#ffffff12;
 --scene:#86c98b;--sceneBg:#1d2e1f;--dlg:#6fb1f5;--dlgTx:#cfe2fb;--mono:#cf93e6;--monoTx:#ecd7f5;--monoBg:#2a1f30;--th:#f0a35c;--thTx:#f8dcc0;--thBg:#33261a;--dual:#4dd0e1;--dualTx:#c6eef3;--tr:#ef9a9a;--note:#e6c75a;--noteBg:#332d14;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);min-height:100vh}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
 padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 220px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--mut);letter-spacing:0}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:#2e9e4f;box-shadow:0 0 0 0 #2e9e4f66;animation:pulse 2.4s infinite}
.live.off i{background:#c0392b;animation:none}.live.wait i{background:#b8860b;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 #2e9e4f55}70%{box-shadow:0 0 0 7px #2e9e4f00}100%{box-shadow:0 0 0 0 #2e9e4f00}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px}
.seg button,.tog{font:500 13px var(--ui);border:0;background:transparent;color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--sheet);box-shadow:0 1px 2px #0002}
.tog{background:var(--chip)}.tog.on{background:var(--acc);color:#fff}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:1200px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left));display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
nav.idx{position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto;font-size:13px}
@media (max-width:860px){nav.idx{position:static;max-height:none}}
nav.idx details{background:var(--sheet);border-radius:10px;padding:6px 4px;border:1px solid var(--line)}
nav.idx summary{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:6px 10px;cursor:pointer;list-style:none}
nav.idx summary::-webkit-details-marker{display:none}
nav.idx a{display:flex;gap:8px;padding:5px 10px;border-radius:6px;color:var(--ink);text-decoration:none;min-width:0}
nav.idx a:hover{background:var(--chip)}nav.idx a b{color:var(--mut);font-weight:500;font-variant-numeric:tabular-nums;min-width:18px}
nav.idx a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.idx a.on{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.key{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut);padding:10px 10px 4px}.key span{display:inline-flex;align-items:center;gap:5px}.key i{width:3px;height:13px;border-radius:2px;display:inline-block}
/* the script sheet */
.sheet{background:var(--sheet);border-radius:4px;box-shadow:0 1px 3px #0000001a,0 8px 30px #00000010;padding:clamp(22px,6vw,72px) clamp(18px,7vw,90px) clamp(40px,8vw,90px) clamp(26px,9vw,110px);font:clamp(13px,1.6vw,15.5px)/1.25 var(--mono-f);color:var(--ink);min-width:0}
.tpage{text-align:center;padding:40px 0 60px;border-bottom:1px dashed var(--line);margin-bottom:34px}
.tpage h1{font:700 1.5em var(--mono-f);text-transform:uppercase;text-decoration:underline;margin:0 0 1.5em}.tpage p{margin:.3em 0}
.b{white-space:pre-wrap;overflow-wrap:break-word;margin:1.05em 0 0;position:relative}
.sc{font-weight:700;text-transform:uppercase;margin-top:2.2em;padding:.15em .4em;margin-left:-.4em;margin-right:-.4em;border-radius:3px;scroll-margin-top:90px}
.sc .n{position:absolute;left:-3.2em;color:var(--mut);font-weight:700}
.colour .sc{background:var(--sceneBg);color:var(--scene)}
.tr{text-align:right;text-transform:uppercase;font-weight:700}.colour .tr{color:var(--tr)}
.sp{margin-top:1.05em;position:relative}
.cue{margin-left:37%;text-transform:uppercase;font-weight:700}
.par{margin-left:27%;width:40%}.dl{margin-left:17%;width:58%}
.sp .b{margin-top:0}
.colour .sp.dlg .cue{color:var(--dlg)}.colour .sp.dlg .dl{color:var(--dlgTx)}
.colour .sp.mono .cue{color:var(--mono)}.colour .sp.mono .dl{color:var(--monoTx)}
.colour .sp.th .cue{color:var(--th)}.colour .sp.th .dl{color:var(--thTx)}
.colour .sp.dual .cue{color:var(--dual)}.colour .sp.dual .dl{color:var(--dualTx)}
.sp.mono .dl{font-style:italic}.sp.mono .dl i{font-style:normal}
.colour .sp.mono .lane,.colour .sp.th .lane{background:var(--monoBg)}.colour .sp.th .lane{background:var(--thBg)}
.lane{margin-left:15%;width:62%;padding:.15em 0;border-radius:3px;position:relative}
.lane .cue{margin-left:32%}.lane .par{margin-left:16%;width:64%}.lane .dl{margin-left:3%;width:94%}
.colour .lane{box-shadow:inset 3px 0 0 var(--barc)}
.sp.dlg{--barc:var(--dlg)}.sp.mono{--barc:var(--mono)}.sp.th{--barc:var(--th)}.sp.dual{--barc:var(--dual)}
.lab{position:absolute;right:calc(100% + 8px);top:.2em;font:700 9px var(--ui);letter-spacing:.06em;white-space:nowrap;color:var(--mut)}
.colour .sp .lab{color:var(--barc)}
@media (max-width:640px){.lab{position:static;display:block;margin:0 0 .2em 3%}.lane{margin-left:0;width:100%}}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:4%;margin-top:1.05em}.duo .sp{margin-top:0}.duo .lane{margin:0;width:100%}.duo .lane .cue{margin-left:20%}
.note{font:13px/1.45 var(--ui);background:var(--noteBg);color:var(--note);padding:6px 10px;border-radius:6px;border-left:3px solid var(--note)}
.syn{font:italic 12.5px/1.45 var(--ui);color:var(--mut);margin:.4em 0 0;white-space:pre-wrap}
/* brainstorm pages */
.bpages{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.bpages button{font:500 13px var(--ui);border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.bpages button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bsheet{background:var(--sheet);border-radius:10px;border:1px solid var(--line);padding:clamp(18px,4vw,36px);min-width:0}
.bsheet h2{font:700 26px/1.2 var(--ui);margin:0 0 4px;letter-spacing:-.01em}.bsheet .meta{color:var(--mut);font-size:12px;margin-bottom:18px}
.ol{list-style:none;margin:0;padding:0}.ol .ol{padding-left:22px;border-left:1px solid var(--line);margin-left:3px}
.ol li{margin:2px 0}.ol .row{display:flex;gap:8px;align-items:baseline}
.ol .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transform:translateY(-2px)}
.ol .tx{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.ol .done>.row .tx{text-decoration:line-through;opacity:.55}
.ol .fold{cursor:pointer;color:var(--mut);font-size:10px;width:12px;flex-shrink:0;user-select:none}
.tg{font-weight:600;font-size:.82em;padding:0 4px;border-radius:4px;color:var(--tc);background:color-mix(in srgb,var(--tc) 15%,transparent)}
.mn{color:var(--dlg);font-weight:600}
/* states */
.state{max-width:520px;margin:12vh auto;text-align:center;padding:0 16px}.state h2{font:700 22px var(--ui);margin:0 0 8px}.state p{color:var(--mut);margin:0}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);font:500 13px var(--ui);padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.empty{color:var(--mut);font:14px var(--ui)}
</style>
</head><body>
<header><div class="hrow">
 <div class="brand" id="brand">Acorn Script<small id="sub">Shared script</small></div>
 <span class="live wait" id="live"><i></i><span id="liveT">Connecting…</span></span>
 <div class="seg" id="tabs" hidden><button data-v="script" class="on">Script</button><button data-v="brain">Brainstorm</button></div>
 <button class="tog on" id="tCol" title="Colour-code dialogue, monologue and talking head" hidden>Colours</button>
 <button class="tog" id="tNotes" title="Show the writer’s notes inside the script" hidden>Notes</button>
</div></header>
<div id="msg" class="state" hidden></div>
<main id="app" hidden>
 <nav class="idx" id="idx"></nav>
 <div id="view" style="min-width:0"></div>
</main>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---- link config: #d=<doc>&k=<key>&u=<supabase url>&a=<public api key> ---- */
function readCfg(){const h=new URLSearchParams(location.hash.slice(1));let c=null;
 if(h.get('d')&&h.get('k')&&h.get('u')&&h.get('a')){c={d:h.get('d'),k:h.get('k'),u:h.get('u').replace(/\/+$/,''),a:h.get('a')};try{localStorage.setItem('acorn_view_last',JSON.stringify(c))}catch(e){}}
 else{try{c=JSON.parse(localStorage.getItem('acorn_view_last')||'null')}catch(e){}}return c}
const cfg=readCfg();
async function rpc(fn,args){const h={'Content-Type':'application/json',apikey:cfg.a};if(!/^sb_/.test(cfg.a))h.Authorization='Bearer '+cfg.a;
 const r=await fetch(cfg.u+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)});const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){const e=Error((j&&(j.message||j.msg))||('HTTP '+r.status));e.status=r.status;throw e}return j}
/* ---- inline formatting (**bold** *italic* _underline_) ---- */
const FMT_RE=/(\*\*\*|\*\*|\*|_)(?=\S)([^\n]*?\S)\1/;
function fmt(s){let h='',m;s=String(s||'');while(s&&(m=FMT_RE.exec(s))){h+=esc(s.slice(0,m.index));const inner=fmt(m[2]);h+=m[1]==='***'?'<b><i>'+inner+'</i></b>':m[1]==='**'?'<b>'+inner+'</b>':m[1]==='*'?'<i>'+inner+'</i>':'<u>'+inner+'</u>';s=s.slice(m.index+m[0].length)}return h+esc(s)}
const strip=s=>String(s||'').replace(/(\*\*\*|\*\*|\*|_)(?=\S)([^\n]*?\S)\1/g,'$2');
/* ---- state ---- */
let DOC=null,VER=0,view='script',showNotes=false,colour=true,page=null,timer=null,fails=0,UPD=null;
try{const p=JSON.parse(localStorage.getItem('acorn_view_prefs')||'{}');if(p.notes)showNotes=true;if(p.colour===false)colour=false}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('acorn_view_prefs',JSON.stringify({notes:showNotes,colour}))}catch(e){}};
function setLive(kind,t){const l=$('live');l.className='live'+(kind==='ok'?'':kind==='off'?' off':' wait');$('liveT').textContent=t}
function when(ts){const d=new Date(ts),now=new Date();const t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});return d.toDateString()===now.toDateString()?'today '+t:d.toLocaleDateString([],{month:'short',day:'numeric'})+' '+t}
let tT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2400)}
function state(h,p){$('app').hidden=true;$('tabs').hidden=true;$('tCol').hidden=true;$('tNotes').hidden=true;const m=$('msg');m.hidden=false;m.innerHTML='<h2>'+esc(h)+'</h2><p>'+esc(p)+'</p>'}
/* ---- script ---- */
const SPEECH=['parenthetical','dialogue','monologue','talking'];
const LABEL={dlg:'DIALOGUE',mono:'MONOLOGUE',th:'TALKING HEAD',dual:'DUAL'};
function renderScript(){const c=DOC.content||{},bl=Array.isArray(c.blocks)?c.blocks:[];let h='',idx='',n=0,i=0;const nums=!c.print||c.print.nums!==false;
 h+='<div class="tpage"><h1>'+esc(c.title||DOC.title||'Untitled')+'</h1><p>Written by</p><p>'+esc(c.author||'Studio Acorn')+'</p></div>';
 let prevSpeech=null;const out=[];
 while(i<bl.length){const b=bl[i];const t=String(b.text||'');
  if(b.type==='character'){const kind=b.dual?'dual':b.sub==='mono'?'mono':b.sub==='th'?'th':'dlg';let name=strip(t).toUpperCase().trim();if(b.sub==='th'&&!name.includes('('))name+=' (TALKING HEAD)';
   let inner='<span class="lab">'+LABEL[kind]+'</span><div class="b cue">'+esc(name)+'</div>';i++;
   while(i<bl.length&&SPEECH.includes(bl[i].type)){const s=bl[i],st=String(s.text||'');if(s.type==='parenthetical'){let p=st.trim();if(!p.startsWith('('))p='('+p;if(!p.endsWith(')'))p+=')';inner+='<div class="b par">'+fmt(p)+'</div>'}else inner+='<div class="b dl">'+fmt(st)+'</div>';i++}
   const html='<div class="sp '+kind+'"><div class="lane">'+inner+'</div></div>';
   if(b.dual&&out.length&&out[out.length-1].sp){const prev=out.pop();out.push({html:'<div class="duo">'+prev.html+html+'</div>'})}else out.push({html,sp:true});continue}
  if(!t.trim()&&b.type!=='note'){i++;continue}
  if(b.type==='scene'){n++;idx+='<a href="#s'+n+'" data-s="'+n+'"><b>'+n+'</b><span>'+esc(strip(t))+'</span></a>';out.push({html:'<div class="b sc" id="s'+n+'">'+(nums?'<span class="n">'+n+'</span>':'')+fmt(t)+'</div>'+(b.syn&&showNotes?'<div class="syn">'+esc(b.syn)+'</div>':'')})}
  else if(b.type==='transition')out.push({html:'<div class="b tr">'+fmt(t)+'</div>'});
  else if(b.type==='note'){if(showNotes&&t.trim())out.push({html:'<div class="b note">'+esc(t)+'</div>'})}
  else if(SPEECH.includes(b.type)){out.push({html:'<div class="sp dlg"><div class="lane"><div class="b dl">'+fmt(t)+'</div></div></div>',sp:true})}
  else out.push({html:'<div class="b">'+fmt(t)+'</div>'});
  i++}
 h+=out.map(o=>o.html).join('');if(!bl.some(b=>String(b.text||'').trim()))h+='<p class="empty">The script is empty so far.</p>';
 $('view').innerHTML='<div class="sheet'+(colour?' colour':'')+'">'+h+'</div>';
 const used=new Set(bl.filter(b=>b.type==='character').map(b=>b.dual?'dual':b.sub==='mono'?'mono':b.sub==='th'?'th':'dlg'));
 const key=colour&&used.size?'<div class="key">'+['dlg','mono','th','dual'].filter(k=>used.has(k)).map(k=>'<span><i style="background:var(--'+k+')"></i>'+LABEL[k].toLowerCase()+'</span>').join('')+'</div>':'';
 $('idx').innerHTML='<details '+(innerWidth>860?'open':'')+'><summary>Scenes · '+n+'</summary>'+(idx||'<p class="empty" style="padding:4px 10px">No scenes yet</p>')+key+'</details>'}
/* ---- brainstorm ---- */
const DEF_LV=[{c:'#2f6fb0',s:17,w:600},{c:'#2e8a5c',s:15.5,w:500},{c:'#8a4fb5',s:15,w:400},{c:'#b0651a',s:14.5,w:400},{c:'#8a8f98',s:14.5,w:400,i:true}];
const TAGPAL=['#d0553f','#c8841f','#5f9e3a','#2f9aa6','#3f7fd0','#9a5cc9','#c2477a','#7f848e'];
function tagColor(g,tags){g=g.toLowerCase();if(tags&&tags[g]&&tags[g].c)return tags[g].c;let h=0;for(const ch of g)h=(h*31+ch.charCodeAt(0))>>>0;return TAGPAL[h%TAGPAL.length]}
function hiTags(t,tags){return esc(t).replace(/(^|[\s(,;])#([A-Za-z][\w-]*)/g,(m,a,g)=>a+'<span class="tg" style="--tc:'+tagColor(g,tags)+'">#'+g+'</span>').replace(/(^|[\s(,;])@([A-Za-z][\w'’-]*)/g,(m,a,g)=>a+'<span class="mn">@'+g+'</span>')}
function boardOf(){const b=(DOC.content||{}).board;return b&&Array.isArray(b.nodes)?b:null}
function renderBrain(){const B=boardOf();if(!B){$('view').innerHTML='<p class="empty">No brainstorm pages in this file.</p>';$('idx').innerHTML='';return}
 const N=B.nodes,kids=pid=>N.filter(n=>(n.parent||null)===(pid||null)).sort((a,b)=>(a.nb||0)-(b.nb||0));const pages=kids(null);
 const st=B.style&&B.style.v===2&&Array.isArray(B.style.levels)?B.style.levels:DEF_LV;const ct=!B.style||B.style.colorText!==false;
 if(!pages.length){$('view').innerHTML='<p class="empty">No brainstorm pages yet.</p>';$('idx').innerHTML='';return}
 if(!page||!pages.some(p=>p.id===page))page=pages[0].id;const pg=pages.find(p=>p.id===page);
 const name=p=>String(p.title||'').split('\n')[0].replace(/(^|\s)#[A-Za-z][\w-]*/g,'$1').trim()||'Untitled page';
 const walk=(pid,d)=>{const K=kids(pid);if(!K.length)return'';return'<ul class="ol">'+K.map(n=>{const L=st[Math.min(d,st.length-1)],sub=walk(n.id,d+1);
   return'<li class="'+(n.done?'done':'')+'"><div class="row" style="font-size:'+L.s+'px;font-weight:'+L.w+';font-style:'+(L.i?'italic':'normal')+';color:'+(ct?L.c:'var(--ink)')+'">'+(sub?'<span class="fold" role="button" aria-label="Fold">▾</span>':'<span class="fold"></span>')+'<span class="dot" style="background:'+L.c+'"></span><span class="tx">'+hiTags(n.title||'',B.tags)+'</span></div>'+sub+'</li>'}).join('')+'</ul>'};
 let count=0;const cnt=id=>{kids(id).forEach(k=>{count++;cnt(k.id)})};cnt(pg.id);
 $('view').innerHTML='<div class="bpages">'+pages.map(p=>'<button data-p="'+p.id+'" class="'+(p.id===page?'on':'')+'">'+esc(name(p))+'</button>').join('')+'</div><div class="bsheet"><h2>'+esc(name(pg))+'</h2><div class="meta">'+count+' notes</div>'+(walk(pg.id,0)||'<p class="empty">This page is empty.</p>')+'</div>';
 $('view').querySelectorAll('.bpages button').forEach(x=>x.onclick=()=>{page=x.dataset.p;render()});
 $('view').querySelectorAll('.fold[role=button]').forEach(f=>f.onclick=()=>{const ul=f.closest('li').querySelector(':scope>ul');if(!ul)return;ul.hidden=!ul.hidden;f.textContent=ul.hidden?'▸':'▾'});
 $('idx').innerHTML='<details '+(innerWidth>860?'open':'')+'><summary>Pages · '+pages.length+'</summary>'+pages.map(p=>'<a href="#" data-p="'+p.id+'" class="'+(p.id===page?'on':'')+'"><span>'+esc(name(p))+'</span></a>').join('')+'</details>';
 $('idx').querySelectorAll('a[data-p]').forEach(a=>a.onclick=e=>{e.preventDefault();page=a.dataset.p;render();scrollTo(0,0)})}
function render(){const y=scrollY;$('msg').hidden=true;$('app').hidden=false;const hasB=!!(boardOf()&&boardOf().nodes.some(n=>!n.parent));$('tabs').hidden=!hasB;if(!hasB)view='script';
 $('tCol').hidden=$('tNotes').hidden=view!=='script';$('tCol').classList.toggle('on',colour);$('tNotes').classList.toggle('on',showNotes);
 $('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 $('brand').firstChild.textContent=(DOC.content&&DOC.content.title)||DOC.title||'Acorn Script';$('sub').textContent='Shared with '+(DOC.viewer||'you')+' · read-only';document.title=((DOC.content&&DOC.content.title)||DOC.title||'Script')+' · Acorn Script';
 view==='script'?renderScript():renderBrain();scrollTo(0,y)}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;render();scrollTo(0,0)};
$('tCol').onclick=()=>{colour=!colour;savePrefs();render()};$('tNotes').onclick=()=>{showNotes=!showNotes;savePrefs();render()};
/* ---- live updates: ask every 10 s while the page is visible; the server only sends the file when it changed ---- */
async function poll(first){clearTimeout(timer);if(document.hidden&&!first)return;
 try{const r=await rpc('acorn_view',{p_doc:cfg.d,p_key:cfg.k,p_since:VER});fails=0;UPD=r.updated_at;
  if(!r.unchanged){const had=!!DOC;DOC=r;VER=r.version;render();if(had)toast('Updated just now')}
  setLive('ok','Live · updated '+when(UPD))}
 catch(e){if(/no_access/.test(e.message)){setLive('off','No access');state('This link doesn’t work any more','Ask the writer to send you a new one.');return}
  if(/invalid input syntax|not.?found|No API key|Invalid API key/i.test(e.message)&&!DOC){setLive('off','Bad link');state('This link looks incomplete','Copy the whole link again, including everything after the #.');return}
  fails++;setLive(fails>2?'off':'wait',DOC?'Offline · showing the version from '+when(UPD):'Can’t reach the server, retrying…');if(!DOC&&fails>3)state('Can’t load the script right now','Check your connection. This page keeps trying.')}
 timer=setTimeout(poll,fails?Math.min(60000,10000*fails):10000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});addEventListener('online',()=>poll());
if(!cfg){setLive('off','No link');state('Open the link you were sent','This page shows a script that has been shared with you. Use the full link from the writer.')}
else poll(true);
</script>
